apiVersion: 1

datasources:
  - name: parsedmarc-aggregate
    # Stable UID from the currently working dashboard export. Keeping it avoids
    # changing the UID of an already existing datasource during an upgrade.
    uid: dfgfg0zezr5kwe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    version: 1
    editable: false
    jsonData:
      database: dmarc_aggregate-*
      timeField: date_begin
      version: 2.x
      interval: Daily
      flavor: OpenSearch

  - name: parsedmarc-forensic
    uid: afggpt7njctmoe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: false
    # parsedmarc 10.x stores RUF/forensic reports in dmarc_failure-*.
    # Increment the provisioning version so existing Grafana instances receive
    # the corrected index pattern and settings on their next restart.
    # The original manually configured datasource is already at version 5.
    # Use a higher value so Grafana replaces its stale forensic index and
    # time-field settings during provisioning.
    version: 6
    editable: false
    jsonData:
      database: dmarc_failure-*
      timeField: arrival_date
      version: 2.x
      interval: Daily
      flavor: OpenSearch
