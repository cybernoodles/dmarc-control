apiVersion: 1

datasources:
  - name: parsedmarc-aggregate
    # Stable UID from the currently working dashboard export. Keeping it avoids
    # changing the UID of an already existing datasource during an upgrade.
    uid: dfgfg0zezr5kwe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    # Keep this above the database version so the valid OpenSearch version is
    # applied to existing Grafana installations as well.
    version: 8
    editable: false
    jsonData:
      database: dmarc_aggregate-*
      timeField: date_begin
      # grafana-opensearch-datasource 2.34+ validates this as SemVer.
      version: 2.19.5
      interval: Daily
      flavor: OpenSearch

  - name: parsedmarc-forensic
    uid: afggpt7njctmoe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: false
    # parsedmarc 10.x stores RUF/forensic reports in dmarc_failure-*.
    # Increment the provisioning version so existing Grafana instances receive
    # the corrected index pattern and settings on their next restart.
    # The existing Grafana datasource is at version 7. Keep this higher so
    # Grafana applies the corrected index, time field, and OpenSearch version.
    version: 8
    editable: false
    jsonData:
      database: dmarc_failure-*
      timeField: arrival_date
      # grafana-opensearch-datasource 2.34+ validates this as SemVer.
      version: 2.19.5
      interval: Daily
      flavor: OpenSearch
