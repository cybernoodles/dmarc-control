apiVersion: 1

datasources:
  - name: parsedmarc-aggregate
    # Stable UID from the currently working dashboard export. Keeping it avoids
    # changing the UID of an already existing datasource during an upgrade.
    uid: dfgfg0zezr5kwe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    # Grafana only applies provisioned datasource changes when this is at least
    # as high as the version stored in its database. The deployed datasource
    # reached version 9 after UI/plugin migrations, so bump this to 10.
    version: 10
    editable: false
    jsonData:
      database: dmarc_aggregate-*
      timeField: date_begin
      # grafana-opensearch-datasource 2.34+ validates this as SemVer.
      version: 2.19.6
      # A wildcard index must use "No pattern". Setting interval: Daily makes
      # the plugin interpret database as a Moment-style date pattern and yields
      # empty index names for dmarc_aggregate-*.
      timeInterval: 1d
      flavor: opensearch
      pplEnabled: true
      serverless: false
      maxConcurrentShardRequests: 5

  - name: parsedmarc-forensic
    uid: afggpt7njctmoe
    orgId: 1
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: false
    # parsedmarc 10.x stores RUF/forensic reports in dmarc_failure-*.
    # Increment the provisioning version so existing Grafana instances receive
    # the corrected index pattern and settings on their next restart.
    # Keep this above the version stored in Grafana so the corrected wildcard
    # pattern settings are applied on restart.
    version: 10
    editable: false
    jsonData:
      database: dmarc_failure-*
      timeField: arrival_date
      # grafana-opensearch-datasource 2.34+ validates this as SemVer.
      version: 2.19.6
      # Wildcard index: omit interval so the plugin uses "No pattern".
      timeInterval: 1h
      flavor: opensearch
      pplEnabled: true
      serverless: false
      maxConcurrentShardRequests: 5
