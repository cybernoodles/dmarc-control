apiVersion: 1

datasources:
  - name: parsedmarc-aggregate
    uid: parsedmarc-aggregate
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    editable: false
    jsonData:
      database: dmarc_aggregate-*
      timeField: date_begin
      version: 2.x
      interval: Daily
      flavor: OpenSearch

  - name: parsedmarc-forensic
    uid: parsedmarc-forensic
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: false
    editable: false
    jsonData:
      database: dmarc_forensic-*
      timeField: arrival_date
      version: 2.x
      interval: Daily
      flavor: OpenSearch
