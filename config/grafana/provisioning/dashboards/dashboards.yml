apiVersion: 1

providers:
  - name: parsedmarc
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      # Dashboards in a subdirectory are provisioned into a matching Grafana
      # folder. This keeps the forensic dashboard separate so its folder can
      # receive restrictive Grafana permissions.
      foldersFromFilesStructure: true
