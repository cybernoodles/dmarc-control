---
# parsedmarc Stack: OpenSearch + Grafana
# Getestet mit parsedmarc 9.x, OpenSearch 2.x, Grafana 11.x
#
# Voraussetzungen auf dem Docker-Host (docker01):
#   sudo sysctl -w vm.max_map_count=262144
#   (dauerhaft: /etc/sysctl.d/99-opensearch.conf mit "vm.max_map_count=262144")
#
# Persistente Daten liegen bewusst im Projektverzeichnis unter ./data.
# Dies macht den Stack zusammen mit Konfiguration und .env transportabel.
# Vor dem ersten Start: README.md beachten (insbesondere Eigentümer der
# Unterverzeichnisse data/opensearch und data/grafana).
#
# Start: docker compose up -d
# Grafana UI: http://docker01:3020  (admin / siehe GF_SECURITY_ADMIN_PASSWORD)

services:

  # ── OpenSearch (Datenspeicher) ──────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: dmarc-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # Performance / Sicherheit für Single-Node
      - plugins.security.ssl.http.enabled=false
      - plugins.security.disabled=true        # intern kein TLS nötig (nur lokal erreichbar)
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - dmarc-net

  # ── Grafana (Visualisierung, primäres Dashboard) ────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: dmarc-grafana
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/DMARC-Overview.json
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dmarc-net

  # ── parsedmarc (Parser, läuft als Daemon und liest IMAP) ────────────────────
  # Kein offizielles Public Image vorhanden – wird direkt aus dem
  # offiziellen Dockerfile gebaut (einmalig beim ersten "docker compose up --build")
  parsedmarc:
    build:
      context: https://github.com/domainaware/parsedmarc.git
      dockerfile: Dockerfile
    image: parsedmarc:local          # lokaler Image-Name nach dem Build
    container_name: dmarc-parser
    restart: unless-stopped
    volumes:
      - ./config/parsedmarc.ini:/etc/parsedmarc.ini:ro
      - ./dmarc-reports:/input:ro    # alternativ: Dateien manuell ablegen
    command: parsedmarc -c /etc/parsedmarc.ini
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dmarc-net

networks:
  dmarc-net:
    driver: bridge
