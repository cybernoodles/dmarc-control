---
# DMARC Control: Webdashboard + parsedmarc + OpenSearch
# Grafana bleibt über das optionale Compose-Profil "grafana" verfügbar.
# parsedmarc ist auf 11.0.2 gepinnt; OpenSearch auf 2.19.6.
#
# Voraussetzungen auf dem Docker-Host:
#   sudo sysctl -w vm.max_map_count=262144
#   (dauerhaft: /etc/sysctl.d/99-opensearch.conf mit "vm.max_map_count=262144")
#
# Persistente Daten liegen bewusst im Projektverzeichnis unter ./data.
# Dies macht den Stack zusammen mit Konfiguration und .env transportabel.
# Vor dem ersten Start: README.md beachten (insbesondere Eigentümer der
# Unterverzeichnisse data/opensearch, data/dashboard und data/parser-control;
# bei aktiviertem Grafana-Profil zusätzlich data/grafana). Das getrennte
# Backup-Ziel liegt standardmäßig unter ./backups und wird erst nach der
# verpflichtenden Strategiewahl im Web-Setup beschrieben.
#
# Standardstart ohne Grafana: docker compose up -d
# Optional mit Grafana: docker compose --profile grafana up -d
# Grafana UI bei aktivem Profil: http://HOSTNAME_OR_IP:3020
# DMARC Control: http://HOSTNAME_OR_IP:3030

name: dmarc-control

services:

  # ── OpenSearch (Datenspeicher) ──────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.19.6@sha256:8690b204fe914c60ca76d451ac73bc0481e034d32d3779944c8caca56a2b003f
    container_name: dmarc-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # DMARC Control verwendet Query Insights nicht. OpenSearch 2.19 aktiviert
      # sonst drei Top-N-Sammler und schreibt dafür täglich lokale Indizes.
      - search.insights.top_queries.latency.enabled=${OPENSEARCH_QUERY_INSIGHTS_ENABLED:-false}
      - search.insights.top_queries.cpu.enabled=${OPENSEARCH_QUERY_INSIGHTS_ENABLED:-false}
      - search.insights.top_queries.memory.enabled=${OPENSEARCH_QUERY_INSIGHTS_ENABLED:-false}
      # Performance / Sicherheit für Single-Node
      - plugins.security.ssl.http.enabled=false
      - plugins.security.disabled=true        # intern kein TLS nötig (nur lokal erreichbar)
      - path.repo=/mnt/snapshots
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
      - ${DMARC_BACKUP_ROOT:-./backups}/opensearch:/mnt/snapshots
    group_add:
      - "10001"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - dmarc-net

  # ── Grafana (optionale Übergangsvisualisierung) ──────────────────────────
  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:latest
    container_name: dmarc-grafana
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/DMARC-Overview.json
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dmarc-net

  # ── DMARC Control (eigenes v2 Webdashboard) ────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
    image: dmarc-control:local
    container_name: dmarc-dashboard
    restart: unless-stopped
    ports:
      - "3030:8000"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - DMARC_AGGREGATE_INDEX=dmarc_aggregate-*
      - DMARC_FORENSIC_INDEX=dmarc_failure-*
      - DASHBOARD_DATABASE_PATH=/app/data/dashboard.db
      - DASHBOARD_BACKUP_KEY_PATH=/app/data/backup.key
      - BACKUP_MAINTENANCE_LOCK_FILE=/app/parser-control/backup.lock
      - STALE_REPORT_DAYS=3
      - NEW_HOST_WINDOW_DAYS=7
      - DOMAIN_DNS_REFRESH_SECONDS=${DOMAIN_DNS_REFRESH_SECONDS:-3600}
    volumes:
      - ./data/dashboard:/app/data
      - ./data/parser-control:/app/parser-control
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - dmarc-net

  # ── Automatische, im Setup explizit aktivierte Backups ────────────────────
  backup:
    build:
      context: ./backup
    image: dmarc-control-backup:local
    container_name: dmarc-backup
    restart: unless-stopped
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - DASHBOARD_URL=http://dashboard:8000
      - DASHBOARD_DATA_ROOT=/dashboard-data
      - PARSER_CONTROL_ROOT=/run/parser-control
      - STACK_CONFIG_ROOT=/stack-config
      - BACKUP_ROOT=/backups
      - BACKUP_SCHEDULE=${DMARC_BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_RETENTION_DAYS=${DMARC_BACKUP_RETENTION_DAYS:-30}
      - BACKUP_POLL_SECONDS=${DMARC_BACKUP_POLL_SECONDS:-30}
      - BACKUP_PARSER_PAUSE_TIMEOUT=${DMARC_BACKUP_PARSER_PAUSE_TIMEOUT:-60}
      - DMARC_CONTROL_RELEASE=${DMARC_CONTROL_RELEASE:-unknown}
    volumes:
      - ${DMARC_BACKUP_ROOT:-./backups}:/backups
      - ./data/dashboard:/dashboard-data
      - ./data/parser-control:/run/parser-control
      - ./.env:/stack-config/.env:ro
      - ./docker-compose.yml:/stack-config/docker-compose.yml:ro
      - ./config:/stack-config/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      opensearch:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dmarc-backup", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dmarc-net

  # ── parsedmarc (ein verwalteter Mailbox-Consumer) ──────────────────────────
  # Der Supervisor startet genau einen auf 11.0.2 gepinnten parsedmarc-Prozess.
  # Bis eine GUI-Konfiguration erfolgreich getestet und aktiviert wurde,
  # verwendet er unverändert die bestehende Legacy-Konfiguration.
  parsedmarc:
    build:
      context: ./parser
    image: parsedmarc-managed:local
    container_name: dmarc-parser
    restart: unless-stopped
    environment:
      - PARSER_CONTROL_API=http://dashboard:8000/api/internal/parser
      - PARSER_CONTROL_TOKEN_FILE=/run/parser-control/control.token
      - BACKUP_MAINTENANCE_LOCK_FILE=/run/parser-control/backup.lock
      - PARSER_LEGACY_CONFIG=/legacy/parsedmarc.ini
      - PARSER_SAVE_AGGREGATE=True
      - PARSER_SAVE_FAILURE=${PARSEDMARC_SAVE_FAILURE:-False}
      - PARSER_SAVE_SMTP_TLS=False
      - PARSER_OPENSEARCH_HOSTS=opensearch:9200
      - PARSER_OPENSEARCH_SSL=False
      - PARSER_OPENSEARCH_MONTHLY_INDEXES=${PARSER_OPENSEARCH_MONTHLY_INDEXES:-True}
    volumes:
      - ./config:/legacy:ro
      - ./data/parser-control:/run/parser-control:ro
      - ./dmarc-reports:/input:ro    # alternativ: Dateien manuell ablegen
    group_add:
      - "10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      opensearch:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks:
      - dmarc-net

networks:
  dmarc-net:
    driver: bridge
