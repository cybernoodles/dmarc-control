name: Publish container images

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v2.2.0"
        required: true
        type: string

permissions: {}

jobs:
  validate-release:
    name: Validate release version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate semantic release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release version must be a v-prefixed semantic version, for example v2.2.2." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DASHBOARD_DATABASE_PATH: /tmp/dmarc-control-tests/dashboard.db
      DASHBOARD_BACKUP_KEY_PATH: /tmp/dmarc-control-tests/backup.key
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all tests and build the frontend
        run: ./scripts/test.sh

  publish:
    name: Publish ${{ matrix.component.name }}
    needs: [test, validate-release]
    # Release Compose files pin the resulting image digests. Images are
    # therefore published from a reviewed release candidate via manual
    # dispatch; the final Git tag is created only after those digests are
    # committed. A tag push still runs the test job, but must not rebuild the
    # image under an already pinned version.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: dashboard
            context: ./dashboard
            file: ./dashboard/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-dashboard
          - name: parser
            context: ./parser
            file: ./parser/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-parser
          - name: backup
            context: ./backup
            file: ./backup/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-backup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.component.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version || github.ref_name }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/cybernoodles/dmarc-control

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          build-args: |
            DASHBOARD_VERSION=${{ needs.validate-release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
