name: Publish container images

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    name: Test dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DASHBOARD_DATABASE_PATH: /tmp/dmarc-control-tests/dashboard.db
      DASHBOARD_BACKUP_KEY_PATH: /tmp/dmarc-control-tests/backup.key
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/frontend/pnpm-lock.yaml

      - name: Test and build frontend
        working-directory: dashboard/frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test dashboard backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement dashboard/backend/requirements.txt
          PYTHONPATH=dashboard/backend python -m unittest discover \
            -s dashboard/backend/tests -v
          python -m unittest discover -s parser/tests -v

  publish:
    name: Publish ${{ matrix.component.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: dashboard
            context: ./dashboard
            file: ./dashboard/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-dashboard
          - name: parser
            context: ./parser
            file: ./parser/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-parser
          - name: backup
            context: ./backup
            file: ./backup/Dockerfile
            image: ghcr.io/cybernoodles/dmarc-control-backup
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.component.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/cybernoodles/dmarc-control

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
